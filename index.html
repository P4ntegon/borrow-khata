<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#f4f4f2;
  --surface:#ffffff;
  --dark:#111111;
  --mid:#4f4f4f;
  --muted:#6d6d6d;
  --border:rgba(0,0,0,.09);
  --border-strong:rgba(0,0,0,.18);
  --danger:#b42318;
  --danger-bg:#fff4f2;
  --danger-border:#f0c6c0;
  --ok:#17663a;
  --ok-bg:#eef8f1;
  --warn:#8a4b00;
  --warn-bg:#fff7e8;
  --radius:20px;
  --radius-sm:14px;
  --font:'Inter','Noto Sans Bengali','Nirmala UI',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045);
  --topbar-h:68px;
}

[hidden]{display:none!important}

html{-webkit-text-size-adjust:100%;font-size:112.5%}

body{
  margin:0;
  font-family:var(--font);
  font-size:1.0625rem;
  line-height:1.5;
  color:var(--dark);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

svg{display:block}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,p{margin:0}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

:focus-visible{outline:3px solid #111;outline-offset:2px}

.skip-link{
  position:fixed;left:12px;top:-80px;z-index:100;background:#111;color:#fff;
  padding:12px 18px;border-radius:12px;font-weight:650;text-decoration:none;transition:top .15s;
}
.skip-link:focus{top:12px}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;height:var(--topbar-h);
  display:flex;align-items:center;gap:18px;padding:0 20px;
}
.brand{
  display:flex;align-items:center;gap:11px;background:none;border:0;
  color:inherit;cursor:pointer;padding:4px;border-radius:14px;text-align:left;
}
.brand-mark{
  width:42px;height:42px;border-radius:13px;background:#111;color:#fff;
  display:grid;place-items:center;flex-shrink:0;
}
.brand-mark svg{width:23px;height:23px;fill:#fff}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-text strong{font-size:.94rem;letter-spacing:.09em;font-weight:800}
.brand-text span{font-size:.76rem;color:var(--muted);font-weight:500;margin-top:3px}

.desktop-nav{display:none;margin-left:auto;align-items:center;gap:2px}
.desktop-nav button{
  min-height:46px;padding:0 16px;border:0;border-radius:999px;background:transparent;
  font:inherit;font-size:.95rem;font-weight:600;color:var(--mid);cursor:pointer;
  transition:background .15s,color .15s;
}
.desktop-nav button:hover{background:#f0f0ee;color:var(--dark)}
.desktop-nav button.is-active{background:#111;color:#fff}

.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.desktop-nav + .topbar-actions{margin-left:0}

.lang-btn{
  display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:0 15px;
  border:1.5px solid var(--border-strong);border-radius:999px;background:#fff;
  font:inherit;font-size:.9rem;font-weight:650;color:var(--dark);cursor:pointer;
  transition:background .15s;
}
.lang-btn:hover{background:#f5f5f3}
.lang-btn svg{width:18px;height:18px}

.btn.desktop-add{display:none;min-height:48px;padding:0 20px}
.desktop-add svg{width:19px;height:19px}

/* ---------- Layout ---------- */
.main{
  max-width:1180px;margin:0 auto;
  padding:calc(var(--topbar-h) + env(safe-area-inset-top) + 28px) 20px calc(112px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.main:focus{outline:none}

.page-head{margin-bottom:22px}
.page-title{
  font-size:clamp(1.85rem,4vw,2.6rem);font-weight:800;letter-spacing:-.04em;
  line-height:1.05;margin:6px 0 8px;
}
.page-sub{color:var(--muted);font-size:1rem;max-width:64ch}
.eyebrow{
  font-size:.73rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 22px;border:1px solid transparent;border-radius:14px;
  font:inherit;font-size:1rem;font-weight:650;line-height:1;cursor:pointer;
  text-decoration:none;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s,opacity .15s;
}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn-primary{background:#111;color:#fff}
.btn-primary:hover{background:#000}
.btn-ghost{background:#fff;border-color:var(--border-strong);color:var(--dark)}
.btn-ghost:hover{background:#f6f6f4}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#951c13}
.btn-danger-ghost{background:transparent;border-color:var(--danger-border);color:var(--danger)}
.btn-danger-ghost:hover{background:var(--danger-bg)}
.btn-xl{min-height:62px;padding:0 30px;font-size:1.06rem;border-radius:16px}
.btn-sm{min-height:44px;padding:0 16px;font-size:.92rem;border-radius:11px}

.link-btn{
  background:none;border:0;font:inherit;font-size:.95rem;font-weight:650;color:var(--dark);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;
  border-radius:8px;
}
.link-btn:hover{background:#f2f2f0}

/* ---------- Dashboard ---------- */
.hero{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:26px;
  padding:30px;border:1px solid var(--border);border-radius:26px;
  background:linear-gradient(150deg,#ffffff 0%,#f0f0ed 100%);
  box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-90px;top:-110px;width:280px;height:280px;
  border-radius:50%;background:rgba(0,0,0,.035);pointer-events:none;
}
.hero h1{
  font-size:clamp(1.9rem,4vw,2.75rem);letter-spacing:-.045em;line-height:1.03;
  margin:8px 0 10px;max-width:15ch;
}
.hero p{color:var(--muted);max-width:46ch}
.hero .btn{flex-shrink:0;position:relative;z-index:1}
.hero-date{font-size:.88rem;font-weight:600;color:var(--muted);margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat{
  display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px 20px;box-shadow:var(--shadow);font:inherit;color:inherit;
  text-align:left;cursor:pointer;transition:transform .12s,border-color .15s;
}
.stat:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.stat-label{font-size:.85rem;font-weight:650;color:var(--muted)}
.stat-value{font-size:clamp(1.45rem,3vw,2rem);font-weight:800;letter-spacing:-.035em;line-height:1.1}
.stat-hint{font-size:.83rem;color:var(--muted)}
.stat.is-alert{border-color:var(--danger-border);background:var(--danger-bg)}
.stat.is-alert .stat-value{color:var(--danger)}
.stat.is-alert .stat-label{color:#8a2b20}

.alert{
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  margin-top:16px;padding:14px 18px;border-radius:16px;
  background:var(--danger-bg);border:1px solid var(--danger-border);color:#7a1a12;
}
.alert-body{display:flex;align-items:center;gap:12px;min-width:0}
.alert-icon{
  width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;
  color:var(--danger);flex-shrink:0;
}
.alert-icon svg{width:21px;height:21px}
.alert strong{display:block;font-size:1rem}
.alert span.sub{display:block;font-size:.86rem;color:#9a4a41;margin-top:1px}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow);margin-top:16px;overflow:hidden;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:17px 20px;border-bottom:1px solid var(--border);
}
.panel-head h2{font-size:1.15rem;letter-spacing:-.015em}

.recent-row{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:15px 20px;background:transparent;border:0;border-bottom:1px solid var(--border);
  font:inherit;color:inherit;text-align:left;cursor:pointer;
}
.recent-row:last-child{border-bottom:0}
.recent-row:hover{background:#fafaf9}
.recent-avatar{
  width:42px;height:42px;border-radius:12px;background:#f0f0ee;display:grid;place-items:center;
  flex-shrink:0;color:var(--mid);
}
.recent-avatar svg{width:21px;height:21px}
.recent-main{flex:1;min-width:0}
.recent-title-line{display:flex;align-items:center;gap:8px;min-width:0}
.recent-part{
  display:block;flex:1 1 auto;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-lender{display:block;font-size:.86rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-badges{flex:0 0 auto;gap:0;margin-top:0}
.recent-badges .badge{font-size:.68rem;padding:2px 7px}
.recent-price{font-weight:750;white-space:nowrap;font-size:.98rem}
.recent-row > svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.panel-foot{padding:8px;text-align:center;border-top:1px solid var(--border)}
.panel-foot .link-btn{width:100%}

/* ---------- Badges ---------- */
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.75rem;font-weight:700;letter-spacing:.01em;
  padding:4px 9px;border-radius:999px;background:#f0f0ee;
  border:1px solid var(--border);white-space:nowrap;
}
.badge-paid{background:var(--ok-bg);border-color:#cbe7d4;color:var(--ok)}
.badge-unpaid{background:var(--warn-bg);border-color:#f0dfb9;color:var(--warn)}
.badge-no-due{background:var(--ok-bg);border-color:#cbe7d4;color:var(--ok)}
.badge-overdue{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}

/* ---------- Items ---------- */
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.search-wrap{position:relative}
.search-wrap > svg{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:var(--muted);pointer-events:none;
}
.search-input{
  width:100%;min-height:58px;padding:0 52px 0 50px;
  border:1.5px solid var(--border-strong);border-radius:16px;background:#fff;
  font:inherit;font-size:1.03rem;color:var(--dark);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search-input::placeholder{color:#8b8b87}
.search-input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.09)}
.search-clear{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border:0;border-radius:50%;background:#f0f0ee;color:var(--mid);
  display:grid;place-items:center;cursor:pointer;
}
.search-clear:hover{background:#e6e6e2;color:#111}
.search-clear svg{width:19px;height:19px}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-pill{
  display:inline-flex;align-items:center;gap:7px;min-height:47px;padding:0 16px;
  border:1.5px solid var(--border-strong);border-radius:999px;background:#fff;
  font:inherit;font-size:.93rem;font-weight:600;white-space:nowrap;color:var(--mid);
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.filter-pill:hover{background:#f6f6f4;color:#111}
.filter-pill.is-active{background:#111;border-color:#111;color:#fff}
.filter-count{font-size:.78rem;font-weight:700;opacity:.62}

.toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sort-wrap{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.select{
  min-height:46px;border:1.5px solid var(--border-strong);border-radius:12px;background:#fff;
  font:inherit;font-size:.92rem;font-weight:600;color:var(--dark);padding:0 12px;cursor:pointer;
}
.result-count{font-size:.9rem;color:var(--muted);font-weight:600}

.entry-list{display:flex;flex-direction:column;gap:12px}
.entry-card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px 20px;box-shadow:var(--shadow);transition:border-color .15s;
}
.entry-card.is-overdue{border-left:4px solid var(--danger);padding-left:17px}
.entry-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.entry-title{
  font-size:1.17rem;font-weight:750;letter-spacing:-.015em;line-height:1.3;
  overflow-wrap:anywhere;
}
.entry-model{color:var(--muted);font-size:.9rem;margin-top:3px;overflow-wrap:anywhere}
.entry-price{
  font-size:1.32rem;font-weight:800;letter-spacing:-.025em;white-space:nowrap;
  padding-top:2px;
}
.entry-head .badges{margin-top:8px}
.entry-meta{
  display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:10px;
  color:var(--muted);font-size:.88rem;
}
.entry-meta span{display:inline-flex;align-items:center;gap:5px}
.entry-meta svg{width:16px;height:16px;flex-shrink:0}
.entry-meta .late{color:var(--danger);font-weight:650}
.entry-meta .soon{color:var(--warn);font-weight:650}
.entry-lender{font-weight:650;color:var(--dark)}
.entry-notes{
  margin-top:10px;font-size:.9rem;color:var(--muted);
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.entry-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 14px;border:1.5px solid var(--border-strong);border-radius:12px;
  background:#fff;font:inherit;font-size:.9rem;font-weight:650;color:var(--dark);
  text-decoration:none;cursor:pointer;transition:background .15s;
}
.act:hover{background:#f5f5f3}
.act svg{width:18px;height:18px;flex-shrink:0}
.act-danger{color:var(--danger);border-color:var(--danger-border)}
.act-danger:hover{background:var(--danger-bg)}
.act[aria-disabled="true"]{opacity:.4;pointer-events:none}

.empty{
  text-align:center;padding:56px 24px;background:#fff;
  border:1.5px dashed var(--border-strong);border-radius:20px;
}
.empty-icon{
  width:66px;height:66px;border-radius:20px;background:#f0f0ee;color:var(--mid);
  display:grid;place-items:center;margin:0 auto 16px;
}
.empty-icon svg{width:32px;height:32px}
.empty h3{font-size:1.28rem;letter-spacing:-.02em;margin-bottom:6px}
.empty p{color:var(--muted);max-width:40ch;margin:0 auto 20px;font-size:.95rem}

.print-head{display:none}

/* ---------- Lenders ---------- */
.lender-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lender-card{
  display:flex;flex-direction:column;gap:5px;background:#fff;
  border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);
}
.lender-card .badges{margin-bottom:3px}
.lender-name{font-size:1.18rem;font-weight:750;letter-spacing:-.015em;overflow-wrap:anywhere}
.lender-phone{
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.94rem;
  text-decoration:none;width:fit-content;
}
.lender-phone svg{width:16px;height:16px}
.lender-phone:hover{color:#111}
.lender-total{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-top:9px;padding-top:12px;border-top:1px solid var(--border);
}
.lender-total span{font-size:.86rem;color:var(--muted);font-weight:650}
.lender-total strong{font-size:1.42rem;letter-spacing:-.025em}
.lender-total small{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:4px}
.lender-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- Settings ---------- */
.settings-stack{display:flex;flex-direction:column;gap:16px;max-width:780px}
.setting-card{
  background:#fff;border:1px solid var(--border);border-radius:18px;
  padding:20px;box-shadow:var(--shadow);
}
.setting-card h2{font-size:1.12rem;letter-spacing:-.015em;margin-bottom:4px}
.setting-card .desc{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 0;border-top:1px solid var(--border);
}
.setting-row:first-of-type{border-top:0;padding-top:0}
.setting-row .label{font-weight:650}
.setting-row .sub{display:block;font-size:.84rem;color:var(--muted);margin-top:2px;font-weight:400}
.setting-actions{display:flex;flex-wrap:wrap;gap:10px}
.segmented{display:inline-flex;background:#f0f0ee;border-radius:12px;padding:4px;gap:4px;flex-shrink:0}
.segmented button{
  min-height:44px;padding:0 18px;border:0;border-radius:9px;background:transparent;
  font:inherit;font-size:.92rem;font-weight:650;color:var(--mid);cursor:pointer;
}
.segmented button.is-active{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.danger-zone{border-color:var(--danger-border);background:#fffafa}
.danger-zone h2{color:var(--danger)}
.storage-bar{height:8px;border-radius:999px;background:#ededeb;overflow:hidden;margin-top:10px}
.storage-bar span{display:block;height:100%;background:#111;border-radius:999px;transition:width .3s}
.install-tip{
  display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:13px 15px;
  background:#f7f7f5;border:1px solid var(--border);border-radius:12px;
  font-size:.88rem;color:var(--mid);line-height:1.5;
}
.install-tip svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.about-brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.about-brand .brand-mark{width:44px;height:44px;display:grid}
.about-brand strong{display:block;letter-spacing:.07em;font-size:.92rem}
.about-brand > span:last-child > span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}

/* ---------- Dialogs ---------- */
dialog{
  border:0;padding:0;font:inherit;color:inherit;background:transparent;
}
dialog::backdrop{background:rgba(8,8,8,.46);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

.sheet{
  width:min(720px,calc(100vw - 32px));max-width:720px;
  max-height:min(92vh,920px);margin:auto;border-radius:24px;background:#fff;
  box-shadow:0 32px 90px rgba(0,0,0,.32);overflow:hidden;
}
.sheet[open]{display:flex;flex-direction:column;animation:pop .18s ease}
.sheet form{display:flex;flex-direction:column;min-height:0;max-height:inherit}
.dialog-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.dialog-head h2{font-size:1.24rem;letter-spacing:-.02em}
.icon-btn{
  width:46px;height:46px;border:0;border-radius:50%;background:#f0f0ee;color:var(--dark);
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:#e6e6e2}
.icon-btn svg{width:22px;height:22px}
.dialog-body{padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dialog-foot{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:#fff;flex-shrink:0;flex-wrap:wrap;
}
.foot-spacer{flex:1}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field-full{grid-column:1/-1;margin-bottom:14px}
.field label{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:.92rem;font-weight:650;
}
.req{color:var(--danger);font-weight:800}
.hint{
  font-size:.73rem;font-weight:650;color:var(--muted);background:#f1f1ef;
  border-radius:999px;padding:2px 8px;letter-spacing:.02em;
}
.field input,.field textarea{
  width:100%;min-height:54px;border:1.5px solid #d8d8d4;border-radius:13px;
  background:#fbfbfa;padding:12px 14px;font-size:1.05rem;color:var(--dark);
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:#96968f}
.field input:focus,.field textarea:focus{
  border-color:#111;background:#fff;box-shadow:0 0 0 3px rgba(17,17,17,.09);
}
.field input:user-invalid{border-color:var(--danger);background:var(--danger-bg)}
.field input[type="date"]{min-height:54px;padding-right:10px}
.field input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.field input[type="number"]::-webkit-outer-spin-button,
.field input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money-input{position:relative}
.money-prefix{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  font-weight:700;color:var(--muted);pointer-events:none;
}
.money-input input{padding-left:40px}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{
  min-height:40px;padding:0 14px;border:1.5px solid var(--border-strong);border-radius:999px;
  background:#fff;font:inherit;font-size:.85rem;font-weight:600;color:var(--dark);
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{background:#f2f2f0}
.chip.is-on{background:#111;border-color:#111;color:#fff}

.toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.toggle-card{
  display:flex;align-items:center;gap:12px;min-height:72px;
  border:1.5px solid #d8d8d4;border-radius:14px;padding:12px 14px;
  background:#fbfbfa;cursor:pointer;user-select:none;transition:border-color .15s,background .15s;
}
.toggle-card input{position:absolute;opacity:0;width:1px;height:1px}
.toggle-switch{
  position:relative;width:52px;height:30px;border-radius:999px;background:#cfcfca;
  flex-shrink:0;transition:background .18s;
}
.toggle-switch::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s;
}
.toggle-card input:checked + .toggle-switch{background:#111}
.toggle-card input:checked + .toggle-switch::after{transform:translateX(22px)}
.toggle-card input:focus-visible + .toggle-switch{outline:3px solid #111;outline-offset:2px}
.toggle-copy{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.toggle-title{font-weight:650;font-size:.95rem}
.toggle-state{font-size:.84rem;color:var(--muted);margin-top:2px}
.toggle-hint{margin:-6px 0 14px;font-size:.82rem;line-height:1.45;color:var(--muted)}
.state-yes{display:none}
.toggle-card input:checked ~ .toggle-copy .state-yes{display:inline}
.toggle-card input:checked ~ .toggle-copy .state-no{display:none}
.toggle-card:has(input:checked){border-color:#111;background:#f4f4f2}

.form-error{
  background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);
  border-radius:12px;padding:12px 14px;font-weight:650;font-size:.92rem;margin-bottom:14px;
}

.confirm-dialog{
  width:min(440px,calc(100vw - 32px));margin:auto;border-radius:22px;
  background:#fff;padding:24px;box-shadow:0 32px 90px rgba(0,0,0,.32);
}
.confirm-dialog[open]{animation:pop .16s ease}
.confirm-dialog h2{font-size:1.38rem;letter-spacing:-.025em;margin-bottom:8px}
.confirm-dialog p{color:var(--muted);line-height:1.55;margin-bottom:22px;white-space:pre-line}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@keyframes pop{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom));
}
.bottom-nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
  min-height:58px;padding:5px 2px;border:0;border-radius:12px;background:none;
  font:inherit;font-size:.8rem;font-weight:650;color:var(--muted);cursor:pointer;
}
.bottom-nav-btn svg{width:24px;height:24px}
.bottom-nav-btn.is-active{color:#111}
.bottom-nav-btn.is-active svg{stroke-width:2.2}
.nav-add{color:#111}
.nav-add-circle{
  width:54px;height:54px;border-radius:50%;background:#111;color:#fff;
  display:grid;place-items:center;margin-top:-36px;
  box-shadow:0 7px 18px rgba(0,0,0,.24),0 0 0 4px #fff;
}
.nav-add-circle svg{width:26px;height:26px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));z-index:70;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  padding:12px 12px 12px 18px;border-radius:14px;background:#111;color:#fff;
  box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:.95rem;font-weight:600;
  opacity:0;transform:translate(-50%,12px);transition:opacity .18s,transform .18s;
  pointer-events:none;
}
.toast.is-visible{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-action{
  border:0;border-radius:9px;background:#fff;color:#111;padding:8px 14px;
  font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap;
}

/* ---------- Responsive ---------- */
@media(min-width:900px){
  .desktop-nav{display:flex}
  .btn.desktop-add{display:inline-flex}
  .bottom-nav{display:none}
  .topbar-actions .lang-btn{height:48px}
}

@media(max-width:899px){
  .main{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(98px + env(safe-area-inset-bottom))}
}

@media(max-width:700px){
  .topbar-inner{height:62px;padding:0 14px;gap:10px}
  .brand-mark{width:38px;height:38px;border-radius:11px}
  .brand-mark svg{width:21px;height:21px}
  .brand-text strong{font-size:.88rem}
  .brand-text span{font-size:.7rem}
  .lang-btn{min-height:44px;padding:0 12px;font-size:.85rem}
  .lang-btn svg{width:17px;height:17px}
  .main{padding-left:14px;padding-right:14px;padding-top:calc(62px + env(safe-area-inset-top) + 20px)}
  .hero{flex-direction:column;align-items:stretch;gap:18px;padding:22px;border-radius:22px}
  .hero h1{max-width:none}
  .hero .btn{width:100%}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stats .stat:first-child{grid-column:1/-1}
  .stat{padding:15px 16px}
  .stat-value{font-size:1.5rem}
  .alert{align-items:flex-start}
  .alert .btn{flex-shrink:0;min-height:44px;padding:0 16px;font-size:.9rem}
  .recent-row{padding:14px 16px;gap:11px}
  .recent-avatar{width:38px;height:38px;border-radius:11px}
  .recent-price{font-size:.92rem}
  .panel-head{padding:15px 16px}
  .form-grid{grid-template-columns:1fr}
  .toggle-row{grid-template-columns:1fr}
  .field-full{margin-bottom:2px}
  .entry-card{padding:16px}
  .entry-title{font-size:1.08rem}
  .entry-price{font-size:1.18rem}
  .entry-actions .act{flex:1 1 auto}
  .lender-grid{grid-template-columns:1fr}
  .sheet{
    width:100%;max-width:100%;max-height:94vh;
    margin:auto auto 0;border-radius:24px 24px 0 0;
  }
  .dialog-body{padding:16px}
  .dialog-head{padding:16px}
  .dialog-foot{padding-left:16px;padding-right:16px}
  .dialog-foot .btn{flex:1}
  .dialog-foot .foot-spacer{display:none}
  .dialog-foot #deleteEntryBtn{order:3;flex-basis:100%}
  .setting-row{flex-wrap:wrap}
  .setting-actions .btn{flex:1 1 auto}
  .toast{left:14px;right:14px;transform:translateY(12px);max-width:none;bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast.is-visible{transform:translateY(0)}
}

@media(max-width:380px){
  body{font-size:1rem}
  .brand-text span{display:none}
  .brand-text strong{font-size:.82rem}
  .lang-btn span{font-size:.8rem}
  .entry-head{flex-direction:column;gap:4px}
  .entry-price{font-size:1.22rem}
}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11pt;color:#000}
  .topbar,.bottom-nav,.toast,.toolbar,.entry-actions,.page-head,.alert .btn,
  .empty .btn,.panel-foot,.lang-btn{display:none!important}
  .main{padding:0;max-width:none;min-height:0}
  .print-head{display:block;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #111}
  .print-head h2{font-size:20pt;letter-spacing:-.02em;margin-bottom:2px}
  .print-head p{font-size:9pt;color:#555}
  .print-head .brand-line{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;letter-spacing:.08em;font-size:10pt}
  .print-head .brand-line svg{width:16px;height:16px;fill:#111}
  .entry-list{gap:0}
  .entry-card{
    break-inside:avoid;border:0;border-bottom:1px solid #ccc;border-radius:0;
    box-shadow:none;padding:10px 0;
  }
  .entry-card.is-overdue{border-left:0;padding-left:0}
  .entry-title{font-size:12pt}
  .entry-model,.entry-meta,.entry-notes{font-size:8.5pt;color:#444}
  .entry-price{font-size:11pt}
  .entry-head .badges{margin-top:2px}
  .badge{border:1px solid #999;background:#fff!important;color:#000!important;font-size:7.5pt}
  .badge-overdue{border-color:#000;font-weight:800}
  .print-summary{margin-top:14px;padding-top:10px;border-top:2px solid #111;font-size:10pt;font-weight:700}
}

/* ---------- Motion ---------- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

</style>
</head>

  function t(key, vars) {
    var table = dict[lang] || dict.en;
    var value = table[key];
    if (value == null) value = dict.en[key];
    if (value == null) return key;
    if (vars) {
      Object.keys(vars).forEach(function (name) {
        value = value.split('{' + name + '}').join(String(vars[name]));
      });
    }
    return value;
  }

  function apply(root) {
    root = root || document;
    var nodes = root.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    nodes = root.querySelectorAll('[data-i18n-placeholder]');
    for (var j = 0; j < nodes.length; j++) {
      nodes[j].setAttribute('placeholder', t(nodes[j].getAttribute('data-i18n-placeholder')));
    }
    nodes = root.querySelectorAll('[data-i18n-aria]');
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].setAttribute('aria-label', t(nodes[k].getAttribute('data-i18n-aria')));
    }
  }

  function setLang(next) {
    lang = dict[next] ? next : 'en';
    document.documentElement.lang = lang === 'bn' ? 'bn' : 'en';
  }

  window.I18n = {
    t: t,
    apply: apply,
    setLang: setLang,
    languages: ['en', 'bn'],

<script>
(function () {
  'use strict';

  var RECORDS_KEY = 'applecare.borrows.v1';
  var SETTINGS_KEY = 'applecare.settings.v1';
  var APP_ID = 'apple-care-borrow-book';
  var SCHEMA_VERSION = 1;

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function cleanText(value, max) {
    if (typeof value !== 'string') return '';
    return value.replace(/\r\n/g, '\n').trim().slice(0, max);
  }

  function cleanDate(value) {
    if (typeof value !== 'string') return '';
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value.trim());
    if (!match) return '';
    var year = Number(match[1]);
    var month = Number(match[2]);
    var day = Number(match[3]);
    if (year < 2000 || year > 2100) return '';
    var d = new Date(year, month - 1, day);
    if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return '';
    return value.trim();
  }

  function cleanMoney(value) {
    var number = Number(value);
    if (!isFinite(number) || number < 0) return 0;
    if (number > 99999999) number = 99999999;
    return Math.round(number * 100) / 100;
  }

  function sanitize(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var part = cleanText(raw.part, 200);
    var lender = cleanText(raw.lender, 160);
    if (!part || !lender) return null;

    var returned = raw.returned === true;
    var paid = raw.paid === true;
    var now = Date.now();
    var createdAt = Number(raw.createdAt);
    var updatedAt = Number(raw.updatedAt);

    return {
      id: cleanText(raw.id, 80) || uid(),
      part: part,
      model: cleanText(raw.model, 120),
      lender: lender,
      phone: cleanText(raw.phone, 40),
      price: cleanMoney(raw.price),
      dateBorrowed: cleanDate(raw.dateBorrowed) || todayISO(),
      dueDate: cleanDate(raw.dueDate),
      returned: returned,
      returnedDate: returned ? (cleanDate(raw.returnedDate) || todayISO()) : '',
      paid: paid,
      notes: cleanText(raw.notes, 2000),
      createdAt: isFinite(createdAt) && createdAt > 0 ? createdAt : now,
      updatedAt: isFinite(updatedAt) && updatedAt > 0 ? updatedAt : now
    };
  }

  function read(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (err) {
      return fallback;
    }
  }

  function write(key, value) {
    window.localStorage.setItem(key, JSON.stringify(value));
  }

  function all() {
    var raw = read(RECORDS_KEY, []);
    if (!Array.isArray(raw)) return [];
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var record = sanitize(raw[i]);
      if (record) out.push(record);
    }
    return out;
  }

  function saveAll(records) {
    var clean = [];
    for (var i = 0; i < records.length; i++) {
      var record = sanitize(records[i]);
      if (record) clean.push(record);
    }
    write(RECORDS_KEY, clean);
    return clean;
  }

  function get(id) {
    var records = all();
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) return records[i];
    }
    return null;
  }

  function upsert(raw) {
    var record = sanitize(raw);
    if (!record) throw new Error('Invalid entry');
    record.updatedAt = Date.now();
    var records = all();
    var index = -1;
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === record.id) {
        index = i;
        record.createdAt = records[i].createdAt;
        break;
      }
    }
    if (index >= 0) records[index] = record;
    else records.push(record);
    write(RECORDS_KEY, records);
    return record;
  }

  function remove(id) {
    var records = all();
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) {
        var removed = records.splice(i, 1)[0];
        write(RECORDS_KEY, records);
        return { record: removed, index: i };
      }
    }
    return null;
  }

  function restore(record, index) {
    var clean = sanitize(record);
    if (!clean) return null;
    var records = all();
    if (typeof index !== 'number' || index < 0 || index > records.length) {
      records.push(clean);
    } else {
      records.splice(index, 0, clean);
    }
    write(RECORDS_KEY, records);
    return clean;
  }

  function clear() {
    try {
      window.localStorage.removeItem(RECORDS_KEY);
    } catch (err) {
      /* ignore */
    }
  }

  function defaultSettings() {
    var language = 'en';
    try {
      var navLang = (navigator.language || 'en').toLowerCase();
      if (navLang.indexOf('bn') === 0) language = 'bn';
    } catch (err) {
      /* ignore */
    }
    return { lang: language };
  }

  function getSettings() {
    var raw = read(SETTINGS_KEY, null);
    var defaults = defaultSettings();
    if (!raw || typeof raw !== 'object') return defaults;
    return {
      lang: raw.lang === 'bn' ? 'bn' : (raw.lang === 'en' ? 'en' : defaults.lang)
    };
  }

  function saveSettings(patch) {
    var current = getSettings();
    var next = {
      lang: patch && patch.lang === 'bn' ? 'bn' : (patch && patch.lang === 'en' ? 'en' : current.lang)
    };
    try {
      write(SETTINGS_KEY, next);
    } catch (err) {
      /* ignore */
    }
    return next;
  }

  function exportData() {
    return {
      app: APP_ID,
      version: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      records: all()
    };
  }

  function importData(payload) {
    var list = null;
    if (Array.isArray(payload)) list = payload;
    else if (payload && typeof payload === 'object' && Array.isArray(payload.records)) list = payload.records;
    if (!list) throw new Error('Invalid backup');

    var clean = [];
    var seen = {};
    for (var i = 0; i < list.length; i++) {
      var record = sanitize(list[i]);
      if (!record) continue;
      if (seen[record.id]) record.id = uid();
      seen[record.id] = true;
      clean.push(record);
    }
    if (clean.length === 0 && list.length > 0) throw new Error('Invalid backup');
    write(RECORDS_KEY, clean);
    return clean.length;
  }

  function usageBytes() {
    var total = 0;
    try {
      for (var i = 0; i < window.localStorage.length; i++) {
        var key = window.localStorage.key(i);
        if (key && key.indexOf('applecare.') === 0) {
          total += (key.length + (window.localStorage.getItem(key) || '').length) * 2;
        }
      }
    } catch (err) {
      return 0;
    }
    return total;
  }

  function available() {
    try {
      var test = '__applecare_test__';
      window.localStorage.setItem(test, '1');
      window.localStorage.removeItem(test);
      return true;
    } catch (err) {
      return false;
    }
  }

  window.Store = {
    all: all,
    get: get,
    upsert: upsert,
    remove: remove,
    restore: restore,
    clear: clear,
    saveAll: saveAll,
    getSettings: getSettings,
    saveSettings: saveSettings,
    exportData: exportData,
    importData: importData,
    usageBytes: usageBytes,
    available: available,
    todayISO: todayISO,
    uid: uid
  };
})();

</script>

  };

  function $(id) {
    return document.getElementById(id);
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      if (ch === '&') return '&amp;';
      if (ch === '<') return '&lt;';
      if (ch === '>') return '&gt;';
      if (ch === '"') return '&quot;';
      return '&#39;';
    });
  }

  function t(key, vars) {
    return I18n.t(key, vars);
  }

  function countText(base, n) {
    return t(n === 1 ? base + 'One' : base, { n: n });
  }

  function money(amount) {
    var value = Number(amount) || 0;
    var decimals = Math.abs(value % 1) > 0.0001 ? 2 : 0;
    return '৳' + value.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: 2
    });
  }

  function moneyPlain(amount) {
    var value = Number(amount) || 0;
    var decimals = Math.abs(value % 1) > 0.0001 ? 2 : 0;
    return value.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: 2
    });
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var parts = iso.split('-');
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if (isNaN(date.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat(I18n.lang === 'bn' ? 'bn-BD' : 'en-GB', {
        day: 'numeric', month: 'short', year: 'numeric'
      }).format(date);
    } catch (err) {
      return iso;
    }
  }

  function todayLabel() {
    try {
      return new Intl.DateTimeFormat(I18n.lang === 'bn' ? 'bn-BD' : 'en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(new Date());
    } catch (err) {
      return '';
    }
  }

  function dayNumber(iso) {
    var parts = iso.split('-');
    return Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])) / 86400000;
  }

  function daysUntil(iso) {
    if (!iso) return null;
    return dayNumber(iso) - dayNumber(Store.todayISO());
  }

  function isOverdue(record) {
    if (!record || record.returned || !record.dueDate) return false;
    return daysUntil(record.dueDate) < 0;
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 KB';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function digits(value) {
    return String(value || '').replace(/\D/g, '');
  }

  function waNumber(phone) {
    var number = digits(phone);
    if (!number) return '';
    if (number.indexOf('880') === 0) return number;
    if (number.charAt(0) === '0') return '880' + number.slice(1);
    if (number.length === 10) return '880' + number;
    return number;
  }

  function telHref(phone) {
    var raw = String(phone || '').trim();
    return 'tel:' + (raw.charAt(0) === '+' ? '+' : '') + digits(phone);
  }

  function whatsappHref(record) {
    var number = waNumber(record.phone);
    if (!number) return '';
    var model = record.model ? ' (' + record.model + ')' : '';
    var due = record.dueDate ? t('whatsapp.due', { date: fmtDate(record.dueDate) }) : '';
    var message = t('whatsapp.message', {
      lender: record.lender,
      part: record.part,
      model: model,
      price: moneyPlain(record.price),
      date: fmtDate(record.dateBorrowed),
      due: due
    });
    return 'https://wa.me/' + number + '?text=' + encodeURIComponent(message);
  }

  function whatsappLenderHref(group) {
    var number = waNumber(group.phone);
    if (!number) return '';
    var message = t('whatsapp.lenderMessage', {
      lender: group.name,
      price: moneyPlain(group.due)
    });
    return 'https://wa.me/' + number + '?text=' + encodeURIComponent(message);
  }

  function viewFromHash() {
    var hash = (location.hash || '').replace('#', '');
    return VIEWS.indexOf(hash) >= 0 ? hash : 'home';
  }

  function isDue(record) {
    return !record.paid && !record.returned;
  }

  function sumDue(records) {
    var total = 0;
    for (var i = 0; i < records.length; i++) {
      if (isDue(records[i])) total += Number(records[i].price) || 0;
    }
    return total;
  }

  function badge(kind, label) {
    return '<span class="badge' + (kind ? ' badge-' + kind : '') + '">' + esc(label) + '</span>';
  }

  function statusBadges(record) {
    var out = [];
    if (isOverdue(record)) out.push(badge('overdue', t('badge.overdue')));
    out.push(record.returned ? badge('', t('badge.returned')) : badge('', t('badge.borrowed')));
    if (record.paid) out.push(badge('paid', t('badge.paid')));
    else if (record.returned) out.push(badge('no-due', t('badge.noDue')));
    else out.push(badge('unpaid', t('badge.unpaid')));
    return out.join('');
  }

  function recentStatusBadge(record) {
    if (record.returned) return badge(record.paid ? 'paid' : 'no-due', t('badge.returned'));
    if (isOverdue(record)) return badge('overdue', t('badge.overdue'));
    if (record.paid) return badge('paid', t('badge.paid'));
    return badge('unpaid', t('badge.unpaid'));
  }

  function dueHint(record) {
    if (record.returned || !record.dueDate) return { text: '', cls: '' };
    var diff = daysUntil(record.dueDate);
    if (diff === 0) return { text: ' · ' + t('card.dueToday'), cls: 'soon' };
    if (diff < 0) {
      return {
        text: ' · ' + t(diff === -1 ? 'card.daysLateOne' : 'card.daysLate', { n: Math.abs(diff) }),
        cls: 'late'
      };
    }
    return {
      text: ' · ' + t(diff === 1 ? 'card.daysLeftOne' : 'card.daysLeft', { n: diff }),
      cls: diff <= 3 ? 'soon' : ''
    };
  }

  function updateLangButton() {
    var btn = $('langBtn');
    var label = $('langBtnText');
    if (!btn || !label) return;
    label.textContent = I18n.lang === 'en' ? t('settings.langBn') : t('settings.langEn');
    btn.setAttribute('aria-label', t('lang.switch'));
    btn.setAttribute('title', t('lang.switch'));
    document.title = t('app.name') + ' — ' + t('app.subtitle');
  }

  function updateNav() {
    var buttons = document.querySelectorAll('.desktop-nav [data-nav], .bottom-nav [data-nav]');
    for (var i = 0; i < buttons.length; i++) {
      var isActive = buttons[i].getAttribute('data-nav') === state.view;
      buttons[i].classList.toggle('is-active', isActive);
      if (isActive) buttons[i].setAttribute('aria-current', 'page');
      else buttons[i].removeAttribute('aria-current');
    }
  }

  function render() {
    var main = $('main');
    if (!main) return;

    if (!Store.available()) {
      main.innerHTML = '<div class="empty"><div class="empty-icon">' + icons.warning + '</div>' +
        '<h3>Storage is unavailable</h3>' +
        '<p>This browser is blocking local storage, so entries cannot be saved. Please allow site data for this page or try another browser.</p></div>';
      updateNav();
      return;
    }

    if (state.view === 'items') main.innerHTML = renderItemsView();
    else if (state.view === 'lenders') main.innerHTML = renderLendersView();
    else if (state.view === 'settings') main.innerHTML = renderSettingsView();
    else main.innerHTML = renderHomeView();

    updateNav();
    updateLangButton();

    if (state.printAfterRender) {
      state.printAfterRender = false;
      window.setTimeout(function () { window.print(); }, 280);
    }
  }

  /* ---------- Home ---------- */
  function renderHomeView() {
    var records = Store.all();
    var due = records.filter(isDue);
    var notReturned = records.filter(function (r) { return !r.returned; });
    var overdue = notReturned.filter(isOverdue);
    var totalDue = sumDue(records);

    var owedHint = due.length === 0 ? t('stats.owedHintZero') : countText('stats.owedHint', due.length);
    var borrowedHint = notReturned.length === 0 ? t('stats.borrowedHintZero') : countText('stats.borrowedHint', notReturned.length);
    var overdueHint = overdue.length === 0 ? t('stats.overdueHintZero') : t('stats.overdueHint');

    var html = '<section class="hero">' +
      '<div>' +
        '<p class="eyebrow">' + esc(t('hero.eyebrow')) + '</p>' +
        '<h1>' + esc(t('hero.title')) + '</h1>' +
        '<p>' + esc(t('hero.sub')) + '</p>' +
        '<p class="hero-date">' + esc(todayLabel()) + '</p>' +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-xl" data-action="add">' + icons.plus + '<span>' + esc(t('hero.add')) + '</span></button>' +
    '</section>';

    html += '<div class="stats">' +
      statCard('stats.owed', money(totalDue), owedHint, 'unpaid', false) +
      statCard('stats.borrowed', String(notReturned.length), borrowedHint, 'borrowed', false) +
      statCard('stats.overdue', String(overdue.length), overdueHint, 'overdue', overdue.length > 0) +
    '</div>';

    if (overdue.length > 0) {
      var alertTitle = countText('alert.overdueTitle', overdue.length);
      html += '<div class="alert">' +
        '<div class="alert-body">' +
          '<span class="alert-icon">' + icons.warning + '</span>' +
          '<div><strong>' + esc(alertTitle) + '</strong><span class="sub">' + esc(t('alert.overdueSub')) + '</span></div>' +
        '</div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-nav="items" data-filter="overdue">' + esc(t('action.view')) + '</button>' +
      '</div>';
    }

    if (records.length === 0) {
      html += '<div class="empty" style="margin-top:16px">' +
        '<div class="empty-icon">' + icons.box + '</div>' +
        '<h3>' + esc(t('empty.title')) + '</h3>' +
        '<p>' + esc(t('empty.text')) + '</p>' +
        '<button type="button" class="btn btn-primary btn-xl" data-action="add">' + icons.plus + '<span>' + esc(t('empty.cta')) + '</span></button>' +
      '</div>';
    } else {
      var recent = records.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 5);
      html += '<section class="panel">' +
        '<div class="panel-head"><h2>' + esc(t('panel.recent')) + '</h2>' +
          '<button type="button" class="link-btn" data-nav="items">' + esc(t('action.seeAll')) + '</button>' +
        '</div>' +
        recent.map(recentRow).join('') +
        '<div class="panel-foot"><button type="button" class="link-btn" data-nav="items">' + esc(t('action.seeAll')) + '</button></div>' +
      '</section>';
    }

    return html;
  }

  function statCard(labelKey, value, hint, filter, alert) {
    return '<button type="button" class="stat' + (alert ? ' is-alert' : '') + '" data-nav="items" data-filter="' + filter + '">' +
      '<span class="stat-label">' + esc(t(labelKey)) + '</span>' +
      '<span class="stat-value">' + esc(value) + '</span>' +
      '<span class="stat-hint">' + esc(hint) + '</span>' +
    '</button>';
  }

  function recentRow(record) {
    return '<button type="button" class="recent-row" data-edit="' + esc(record.id) + '">' +
      '<span class="recent-avatar">' + icons.box + '</span>' +
      '<span class="recent-main">' +
        '<span class="recent-title-line">' +
          '<span class="recent-part">' + esc(record.part) + '</span>' +
          '<span class="badges recent-badges">' + recentStatusBadge(record) + '</span>' +
        '</span>' +
        '<span class="recent-lender">' + esc(record.lender) + (record.model ? ' · ' + esc(record.model) : '') + '</span>' +
      '</span>' +
      '<span class="recent-price">' + esc(money(record.price)) + '</span>' +
      icons.chevron +
    '</button>';
  }

  /* ---------- Items ---------- */
  function matchesFilter(record, filter) {
    if (filter === 'borrowed') return !record.returned;
    if (filter === 'returned') return record.returned;
    if (filter === 'unpaid') return isDue(record);
    if (filter === 'overdue') return isOverdue(record);
    return true;
  }

  function getFilteredRecords() {
    var records = Store.all();
    var query = state.search.trim().toLowerCase();

    if (query) {
      records = records.filter(function (record) {
        var haystack = [record.part, record.model, record.lender, record.phone, record.notes]
          .join(' ').toLowerCase();
        return haystack.indexOf(query) >= 0;
      });
    }

    records = records.filter(function (record) {
      return matchesFilter(record, state.filter);
    });

    records.sort(function (a, b) {
      if (state.sort === 'dueSoon') {
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return b.createdAt - a.createdAt;
      }
      if (state.sort === 'priceHigh') return (b.price || 0) - (a.price || 0);
      if (state.sort === 'priceLow') return (a.price || 0) - (b.price || 0);
      if (state.sort === 'lender') return a.lender.localeCompare(b.lender);
      return b.createdAt - a.createdAt;
    });

    return records;
  }

  function filterCounts() {
    var records = Store.all();
    return {
      all: records.length,
      borrowed: records.filter(function (r) { return !r.returned; }).length,
      returned: records.filter(function (r) { return r.returned; }).length,
      unpaid: records.filter(isDue).length,
      overdue: records.filter(isOverdue).length
    };
  }

  function renderItemsView() {
    var records = Store.all();
    var counts = filterCounts();
    var filtered = getFilteredRecords();
    var filters = ['all', 'borrowed', 'returned', 'unpaid', 'overdue'];

    var html = '<div class="page-head">' +
      '<p class="eyebrow">' + esc(t('app.subtitle')) + '</p>' +
      '<h1 class="page-title">' + esc(t('items.title')) + '</h1>' +
      '<p class="page-sub">' + esc(t('items.sub')) + '</p>' +
    '</div>';

    html += '<div class="toolbar">' +
      '<div class="search-wrap">' + icons.search +
        '<input type="search" id="searchInput" class="search-input" placeholder="' + esc(t('search.placeholder')) + '" value="' + esc(state.search) + '" autocomplete="off" aria-label="' + esc(t('search.placeholder')) + '">' +
        '<button type="button" class="search-clear" id="searchClear" aria-label="' + esc(t('search.clear')) + '"' + (state.search ? '' : ' hidden') + '>' + icons.close + '</button>' +
      '</div>' +
      '<div class="filters" role="group" aria-label="' + esc(t('filters.label')) + '">' +
        filters.map(function (filter) {
          return '<button type="button" class="filter-pill' + (state.filter === filter ? ' is-active' : '') + '" data-filter="' + filter + '" aria-pressed="' + (state.filter === filter) + '">' +
            esc(t('filters.' + filter)) +
            '<span class="filter-count">' + counts[filter] + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="toolbar-row">' +
        '<div class="sort-wrap"><label for="sortSelect">' + esc(t('sort.label')) + '</label>' +
          '<select id="sortSelect" class="select">' +
            '<option value="newest"' + (state.sort === 'newest' ? ' selected' : '') + '>' + esc(t('sort.newest')) + '</option>' +
            '<option value="dueSoon"' + (state.sort === 'dueSoon' ? ' selected' : '') + '>' + esc(t('sort.dueSoon')) + '</option>' +
            '<option value="priceHigh"' + (state.sort === 'priceHigh' ? ' selected' : '') + '>' + esc(t('sort.priceHigh')) + '</option>' +
            '<option value="priceLow"' + (state.sort === 'priceLow' ? ' selected' : '') + '>' + esc(t('sort.priceLow')) + '</option>' +
            '<option value="lender"' + (state.sort === 'lender' ? ' selected' : '') + '>' + esc(t('sort.lender')) + '</option>' +
          '</select>' +
        '</div>' +
        '<span class="result-count" id="resultCount" aria-live="polite">' + esc(countText('results.count', filtered.length)) + '</span>' +
      '</div>' +
    '</div>';

    html += printHead(records);
    html += '<div id="itemsResults">' + itemsResultsHtml(records, filtered) + '</div>';
    return html;
  }

  function printHead(records) {
    var total = sumDue(records);
    var summary = records.length === 1
      ? t('print.summaryOne', { total: moneyPlain(total) })
      : t('print.summary', { total: moneyPlain(total), n: records.length });
    return '<div class="print-head">' +
      '<div class="brand-line">' + icons.apple + ' APPLE CARE</div>' +
      '<h2>' + esc(t('print.title')) + '</h2>' +
      '<p>' + esc(t('print.sub')) + '</p>' +
      '<p>' + esc(fmtDate(Store.todayISO())) + ' · ' + esc(summary) + '</p>' +
    '</div>';
  }

  function itemsResultsHtml(records, filtered) {
    if (records.length === 0) {
      return '<div class="empty">' +
        '<div class="empty-icon">' + icons.box + '</div>' +
        '<h3>' + esc(t('empty.title')) + '</h3>' +
        '<p>' + esc(t('empty.text')) + '</p>' +
        '<button type="button" class="btn btn-primary btn-xl" data-action="add">' + icons.plus + '<span>' + esc(t('empty.cta')) + '</span></button>' +
      '</div>';
    }
    if (filtered.length === 0) {
      return '<div class="empty">' +
        '<div class="empty-icon">' + icons.search + '</div>' +

        '<p>' + esc(t('empty.noMatchText')) + '</p>' +
        '<button type="button" class="btn btn-ghost btn-xl" data-action="clear-filters">' + esc(t('filters.all')) + '</button>' +

  function refreshItemsResults() {
    var records = Store.all();
    var filtered = getFilteredRecords();
    var list = $('itemsResults');

    var clear = $('searchClear');
    if (list) list.innerHTML = itemsResultsHtml(records, filtered);

  /* ---------- Lenders ---------- */
  function lenderGroups(records) {
    var map = {};
    records.forEach(function (record) {
      var key = record.lender.trim().toLowerCase();
      if (!map[key]) {
        map[key] = { name: record.lender.trim(), phone: '', records: [], due: 0, unpaid: 0 };
      }
      var group = map[key];
      group.records.push(record);
      if (!group.phone && record.phone) group.phone = record.phone;
      if (isDue(record)) {
        group.due += Number(record.price) || 0;
        group.unpaid += 1;
      }
    });
    return Object.keys(map).map(function (key) { return map[key]; }).sort(function (a, b) {
      return b.due - a.due || a.name.localeCompare(b.name);
    });
  }

    return html + '<div class="lender-grid">' + groups.map(function (group) {
      var phone = digits(group.phone);

        if (group.unpaid > 0) {
          actions += '<a class="act" href="' + esc(whatsappLenderHref(group)) + '" target="_blank" rel="noopener noreferrer">' + icons.whatsapp + '<span>' + esc(t('action.whatsapp')) + '</span></a>';
        }

      actions += '<button type="button" class="act" data-action="lender-parts" data-lender="' + esc(group.name) + '">' + icons.box + '<span>' + esc(t('lenders.viewParts')) + '</span></button>';

      return '<article class="lender-card">' +
        '<div class="badges"><span class="badge">' + esc(countText('lenders.partsCount', group.records.length)) + '</span>' +
          (group.unpaid > 0 ? '<span class="badge badge-unpaid">' + esc(t('lenders.unpaidCount', { n: group.unpaid })) + '</span>' : '') +
        '</div>' +
        '<h3 class="lender-name">' + esc(group.name) + '</h3>' +
        (phone ? '<a class="lender-phone" href="' + esc(telHref(group.phone)) + '">' + icons.phone + esc(group.phone) + '</a>' : '') +
        '<div class="lender-total"><span>' + esc(t('lenders.owed')) + '</span><strong>' + esc(money(group.due)) + '</strong></div>' +
        '<div class="lender-actions">' + actions + '</div>' +
      '</article>';
    }).join('') + '</div>';
  }

  /* ---------- Entry dialog ---------- */
  function renderPartChips() {
    var wrap = $('partChips');
    if (!wrap) return;
    wrap.innerHTML = PART_KEYS.map(function (key) {
      return '<button type="button" class="chip" data-chip="' + key + '">' + esc(t('parts.' + key)) + '</button>';
    }).join('');
    wrap.setAttribute('aria-label', t('form.suggestions'));
    updateChips();
  }

  function updateChips() {
    var input = $('fPart');
    var chips = document.querySelectorAll('#partChips [data-chip]');
    if (!input || !chips.length) return;
    var value = input.value.trim();
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('is-on', chips[i].textContent.trim() === value);
    }
  }

  function populateLenderList() {
    var list = $('lenderList');
    if (!list) return;
    var seen = {};
    var names = [];
    Store.all().forEach(function (record) {
      var key = record.lender.trim().toLowerCase();
      if (!seen[key]) {
        seen[key] = true;
        names.push(record.lender.trim());
      }
    });
    names.sort(function (a, b) { return a.localeCompare(b); });
    list.innerHTML = names.map(function (name) {
      return '<option value="' + esc(name) + '"></option>';
    }).join('');
  }

  function openEntry(id) {
    var record = id ? Store.get(id) : null;
    if (id && !record) return;

    state.editingId = record ? record.id : null;
    var form = $('entryForm');
    if (!form) return;
    form.reset();
    $('formError').hidden = true;
    $('deleteEntryBtn').hidden = !record;
    $('entryDialogTitle').textContent = t(record ? 'dialog.editTitle' : 'dialog.addTitle');

    $('fPart').value = record ? record.part : '';
    $('fModel').value = record ? record.model : '';
    $('fLender').value = record ? record.lender : '';
    $('fPhone').value = record ? record.phone : '';
    $('fPrice').value = record && record.price !== 0 ? record.price : (record ? '0' : '');
    $('fDateBorrowed').value = record ? record.dateBorrowed : Store.todayISO();
    $('fDueDate').value = record ? record.dueDate : '';
    $('fReturned').checked = record ? record.returned : false;
    $('fPaid').checked = record ? record.paid : false;
    $('fNotes').value = record ? record.notes : '';

    renderPartChips();
    populateLenderList();

    var dialog = $('entryDialog');
    if (!dialog.open) dialog.showModal();
    window.setTimeout(function () {
      var part = $('fPart');
      if (part) part.focus();
    }, 40);
  }

  function closeEntry() {
    var dialog = $('entryDialog');
    if (dialog && dialog.open) dialog.close();
  }

  function showFormError(message, fieldId) {
    var box = $('formError');
    box.textContent = message;
    box.hidden = false;
    if (fieldId) {
      var field = $(fieldId);
      if (field) field.focus();
    }
    box.scrollIntoView({ block: 'nearest' });
  }

  function saveEntry(event) {
    event.preventDefault();
    var data = {
      part: $('fPart').value.trim(),
      model: $('fModel').value.trim(),
      lender: $('fLender').value.trim(),
      phone: $('fPhone').value.trim(),
      price: $('fPrice').value,
      dateBorrowed: $('fDateBorrowed').value,
      dueDate: $('fDueDate').value,
      returned: $('fReturned').checked,
      paid: $('fPaid').checked,
      notes: $('fNotes').value.trim()
    };

    if (!data.part) return showFormError(t('form.errPart'), 'fPart');
    if (!data.lender) return showFormError(t('form.errLender'), 'fLender');
    if (data.price === '' || !isFinite(Number(data.price)) || Number(data.price) < 0) {
      return showFormError(t('form.errPrice'), 'fPrice');
    }
    if (!data.dateBorrowed) return showFormError(t('form.errDate'), 'fDateBorrowed');

    var existing = state.editingId ? Store.get(state.editingId) : null;
    var returnedDate = '';
    if (data.returned) {
      returnedDate = existing && existing.returned && existing.returnedDate
        ? existing.returnedDate
        : Store.todayISO();
    }

    try {
      Store.upsert({
        id: existing ? existing.id : '',
        part: data.part,
        model: data.model,
        lender: data.lender,
        phone: data.phone,
        price: data.price,
        dateBorrowed: data.dateBorrowed,
        dueDate: data.dueDate,
        returned: data.returned,
        returnedDate: returnedDate,
        paid: data.paid,
        notes: data.notes,
        createdAt: existing ? existing.createdAt : Date.now()
      });
    } catch (err) {
      return showFormError(t('form.errSave'));
    }

    state.editingId = null;
    closeEntry();
    render();
    showToast(existing ? t('toast.updated') : t('toast.saved'));
  }

  /* ---------- Confirm & toast ---------- */
  function askConfirm(options) {
    return new Promise(function (resolve) {
      var dialog = $('confirmDialog');
      $('confirmTitle').textContent = options.title;
      $('confirmMessage').textContent = options.message;
      $('confirmCancel').textContent = options.cancel || t('confirm.no');
      $('confirmOk').textContent = options.confirm || t('confirm.no');
      dialog.returnValue = '';
      dialog.showModal();

      function onClose() {
        dialog.removeEventListener('close', onClose);
        resolve(dialog.returnValue === 'confirm');
      }
      dialog.addEventListener('close', onClose);
    });
  }

  function hideToast() {
    var el = $('toast');
    if (!el) return;
    el.classList.remove('is-visible');
    window.setTimeout(function () {
      if (!el.classList.contains('is-visible')) el.hidden = true;
    }, 220);
  }

  function showToast(message, actionLabel, onAction, duration) {
    var el = $('toast');
    var msg = $('toastMsg');
    var action = $('toastAction');
    if (!el) return;

    if (state.toastTimer) window.clearTimeout(state.toastTimer);

    msg.textContent = message;
    if (actionLabel && onAction) {
      action.hidden = false;
      action.textContent = actionLabel;
      action.onclick = function () {
        hideToast();
        onAction();
      };
    } else {
      action.hidden = true;
      action.onclick = null;
    }

    el.hidden = false;
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        el.classList.add('is-visible');
      });
    });

    state.toastTimer = window.setTimeout(hideToast, duration || 6000);
  }

  /* ---------- Delete / import / export ---------- */
  function requestDelete(id) {
    var record = Store.get(id);
    if (!record) return;
    askConfirm({
      title: t('confirm.deleteTitle'),
      message: record.part + ' · ' + record.lender + '. ' + t('confirm.deleteText'),
      confirm: t('confirm.yesDelete')
    }).then(function (ok) {
      if (!ok) return;
      var removed = Store.remove(id);
      if (!removed) return;
      render();
      showToast(t('toast.deleted'), t('action.undo'), function () {
        Store.restore(removed.record, removed.index);
        render();
        showToast(t('toast.restored'));
      });
    });
  }

  function clearAll() {
    askConfirm({
      title: t('confirm.deleteAllTitle'),
      message: t('confirm.deleteAllText'),
      confirm: t('confirm.yesDeleteAll')
    }).then(function (ok) {
      if (!ok) return;
      Store.clear();
      render();
      showToast(t('toast.cleared'));
    });
  }

  function exportBackup() {
    var data = Store.exportData();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'apple-care-backup-' + Store.todayISO() + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    showToast(t('toast.exported'));
  }

  function importBackupFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var payload;
      try {
        payload = JSON.parse(String(reader.result));
      } catch (err) {
        showToast(t('toast.importError'));
        return;
      }
      askConfirm({
        title: t('confirm.importTitle'),
        message: t('confirm.importText'),
        confirm: t('confirm.yesImport')
      }).then(function (ok) {
        if (!ok) return;
        try {
          var count = Store.importData(payload);
          render();
          showToast(count === 1 ? t('toast.importedOne') : t('toast.imported', { n: count }));
        } catch (err) {
          showToast(t('toast.importError'));
        }
      });
    };
    reader.onerror = function () { showToast(t('toast.importError')); };
    reader.readAsText(file);
  }

  function printList() {
    state.view = 'items';
    state.filter = 'all';
    state.search = '';
    state.sort = 'newest';
    state.printAfterRender = true;
    if (location.hash !== '#items') location.hash = 'items';
    else render();
  }

  async function installApp() {
    if (!state.deferredPrompt) {
      showToast(t('settings.noInstall'));
      return;
    }
    state.deferredPrompt.prompt();
    try {
      await state.deferredPrompt.userChoice;
    } catch (err) {
      /* ignore */
    }
    state.deferredPrompt = null;
    render();
  }

  /* ---------- Navigation & language ---------- */
  function navigate(view, options) {
    options = options || {};
    if (options.filter !== undefined) state.filter = options.filter;
    if (options.search !== undefined) state.search = options.search;
    if (options.sort !== undefined) state.sort = options.sort;

    state.view = VIEWS.indexOf(view) >= 0 ? view : 'home';
    if (location.hash !== '#' + state.view) {
      location.hash = state.view;
    } else {
      render();
      window.scrollTo(0, 0);
    }
  }

  function applyLanguage(lang, persist) {
    if (persist) Store.saveSettings({ lang: lang });
    I18n.setLang(lang);
    I18n.apply(document);
    updateLangButton();
    render();
  }

  /* ---------- Events ---------- */
  function bindEvents() {
    document.addEventListener('click', function (event) {
      var langBtn = event.target.closest('#langBtn');
      if (langBtn) {
        applyLanguage(I18n.lang === 'en' ? 'bn' : 'en', true);
        return;
      }

      var langOption = event.target.closest('[data-lang]');
      if (langOption) {
        var next = langOption.getAttribute('data-lang');
        if (next !== I18n.lang) applyLanguage(next, true);
        return;
      }

      var searchClear = event.target.closest('#searchClear');
      if (searchClear) {
        state.search = '';
        var searchInput = $('searchInput');
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        refreshItemsResults();
        return;
      }

      var nav = event.target.closest('[data-nav]');
      if (nav) {
        var filter = nav.getAttribute('data-filter');
        navigate(nav.getAttribute('data-nav'), filter ? { filter: filter, search: '' } : undefined);
        return;
      }

      var filterBtn = event.target.closest('[data-filter]');
      if (filterBtn) {
        state.filter = filterBtn.getAttribute('data-filter');
        state.view = 'items';
        render();
        return;
      }

      var editBtn = event.target.closest('[data-edit]');
      if (editBtn) {
        openEntry(editBtn.getAttribute('data-edit'));
        return;
      }

      var deleteBtn = event.target.closest('[data-delete]');
      if (deleteBtn) {
        requestDelete(deleteBtn.getAttribute('data-delete'));
        return;
      }

      var chip = event.target.closest('[data-chip]');
      if (chip && $('entryDialog').open) {
        var partInput = $('fPart');
        partInput.value = t('parts.' + chip.getAttribute('data-chip'));
        updateChips();
        partInput.focus();
        return;
      }

      var actionBtn = event.target.closest('[data-action]');
      if (!actionBtn) return;
      var action = actionBtn.getAttribute('data-action');

      if (action === 'add') openEntry(null);
      else if (action === 'close-entry') closeEntry();
      else if (action === 'delete-current') {
        var current = state.editingId;
        closeEntry();
        if (current) requestDelete(current);
      } else if (action === 'clear-filters') {
        state.search = '';
        state.filter = 'all';
        render();
      } else if (action === 'lender-parts') {
        navigate('items', { search: actionBtn.getAttribute('data-lender') || '', filter: 'all' });
      } else if (action === 'export') {
        exportBackup();
      } else if (action === 'import') {
        var input = $('importInput');
        if (input) input.click();
      } else if (action === 'print') {
        printList();
      } else if (action === 'clear-all') {
        clearAll();
      } else if (action === 'install') {
        installApp();
      }
    });

    document.addEventListener('input', function (event) {
      if (event.target.id === 'searchInput') {
        state.search = event.target.value;
        refreshItemsResults();
      }
      if (event.target.id === 'fPart') updateChips();
    });

    document.addEventListener('change', function (event) {
      if (event.target.id === 'sortSelect') {
        state.sort = event.target.value;
        render();
      }
      if (event.target.id === 'importInput') {
        var file = event.target.files && event.target.files[0];
        event.target.value = '';
        importBackupFile(file);
      }
    });

    var form = $('entryForm');
    if (form) form.addEventListener('submit', saveEntry);

    var entryDialog = $('entryDialog');
    if (entryDialog) {
      entryDialog.addEventListener('close', function () {
        state.editingId = null;
        var error = $('formError');
        if (error) error.hidden = true;
      });
      entryDialog.addEventListener('click', function (event) {
        if (event.target === entryDialog) entryDialog.close();
      });
    }

    var confirmDialog = $('confirmDialog');
    if (confirmDialog) {
      confirmDialog.addEventListener('click', function (event) {
        if (event.target === confirmDialog) confirmDialog.close('cancel');
      });
    }

    window.addEventListener('hashchange', function () {
      state.view = viewFromHash();
      render();
      window.scrollTo(0, 0);
      var main = $('main');
      if (main) main.focus({ preventScroll: true });
    });

    window.addEventListener('storage', function (event) {
      if (!event.key || event.key.indexOf('applecare.') !== 0) return;
      var settings = Store.getSettings();
      if (settings.lang !== I18n.lang) {
        I18n.setLang(settings.lang);
        I18n.apply(document);
        updateLangButton();
      }
      render();
    });

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      state.deferredPrompt = event;
      if (state.view === 'settings') render();
    });

    window.addEventListener('appinstalled', function () {
      state.deferredPrompt = null;
      render();
    });
  }


  function init() {
    var settings = Store.getSettings();
    I18n.setLang(settings.lang);
    I18n.apply(document);
    updateLangButton();

    state.view = viewFromHash();
    bindEvents();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
